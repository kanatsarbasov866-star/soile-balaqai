<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сөйле, балақай</title>
<style>
@font-face{font-family:"KZ You";src:url("fonts/kz-you.ttf") format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:"KZ Taurus";src:url("fonts/kz-taurus.ttf") format("truetype");font-weight:400;font-display:swap;unicode-range:U+0000-002C,U+002E-FFFF}
/* Layout idea: deep-teal sidebar with the 23 numbered sections; bright white work area where every task sits on its own sheet. Single light theme by choice (a children's classroom world). */
:root{
  color-scheme:light;
  --bg:#eaf5f2; --surface:#ffffff; --soft:#dcf0ec; --line:#c9e0db;
  --ink:#10323d; --muted:#4f6d77;
  --primary:#0b8782; --primary-deep:#0a4f55;
  --sun:#ffc42e; --coral:#ff6650; --good:#1f9d57; --bad:#d8452f;
  --display:"KZ You","Segoe UI",system-ui,sans-serif;
  --body:"KZ Taurus",system-ui,-apple-system,"Segoe UI",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 19px/1.5 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
p{margin:0}
.app{display:grid;grid-template-columns:292px 1fr;min-height:100%}

/* sidebar */
.side{background:var(--primary-deep);color:#fff;padding:22px 14px 30px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 18px;text-decoration:none;color:#fff}
.brand-mark{width:46px;height:46px;border-radius:14px;background:var(--sun);display:grid;place-items:center;font:800 22px var(--display);color:var(--primary-deep);flex:none}
.brand b{font:800 15px/1.2 var(--display);display:block}
.brand span{font-size:13px;opacity:.75}
.nav-group{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:14px 10px 6px;font-weight:800}
.nav a{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:12px;color:#fff;text-decoration:none;font-weight:700;font-size:15.5px;line-height:1.3}
.nav a .n{font-variant-numeric:tabular-nums;font-size:12px;opacity:.55;min-width:18px}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a.on{background:var(--sun);color:var(--primary-deep)}
.nav a.on .n{opacity:.8}
.menu-btn{display:none}

/* main */
main{padding:28px clamp(16px,4vw,48px) 60px;min-width:0}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-direction:column;gap:10px}
.kicker{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.page-head h1{font-size:clamp(26px,4.2vw,40px);font-weight:800}
.lead{font-size:19px;color:var(--muted);max-width:66ch}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px;font-weight:600}
.sheet h3{font-size:17px;font-weight:600}
.sheet p,.sheet li{max-width:68ch}
.sheet ul,.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:center}
.step-n{font:800 13px var(--display);background:var(--soft);color:var(--primary-deep);border-radius:999px;padding:5px 11px;white-space:nowrap}
.tag{display:inline-block;font-weight:800;font-size:12px;letter-spacing:.07em;text-transform:uppercase;background:var(--coral);color:#fff;border-radius:999px;padding:3px 10px}
.hint{color:var(--muted);font-size:16px}
.emoji{font-family:var(--emoji);line-height:1;display:inline-block}
.btn{border:0;background:var(--primary);color:#fff;font-weight:800;border-radius:999px;padding:10px 18px}
.btn:hover{background:var(--primary-deep)}
.btn.ghost{background:var(--soft);color:var(--primary-deep)}
.btn.sun{background:var(--sun);color:var(--primary-deep)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* placeholders to fill later */
.ph{border:2px dashed var(--coral);border-radius:12px;padding:8px 12px;color:#a23a2a;background:#fff4f1;font-weight:700}
.ph small{display:block;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.photo-ph{aspect-ratio:3/4;width:100%;max-width:240px;display:grid;place-items:center;text-align:center}

/* home */
.hero{background:var(--primary-deep);color:#fff;border-radius:26px;padding:clamp(22px,4vw,40px);display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.hero .ph{background:rgba(255,255,255,.08);color:#ffd9d1;border-color:#ff9c8c}
.hero h1{font-size:clamp(28px,5vw,48px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero-col{display:flex;flex-direction:column;gap:14px}
.hero p.sub{font-size:19px;opacity:.9;max-width:46ch}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.dir a{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-decoration:none;color:var(--ink);display:flex;gap:12px;align-items:center;font-weight:800;line-height:1.25}
.dir a:hover{border-color:var(--primary);box-shadow:0 4px 0 var(--line)}
.dir a .emoji{font-size:30px}
.dir a small{display:block;font-weight:700;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.group-title{font:600 15px var(--display);color:var(--primary-deep);margin-top:6px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.card{background:var(--soft);border:0;border-radius:16px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.card .emoji{font-size:54px}
.card b{font-weight:800;font-size:17px;line-height:1.2}
.cards.hide-words .card b{visibility:hidden}
.cards.hide-words .card.shown b{visibility:visible}
.card.wide{grid-column:span 1}
.swatch{width:64px;height:64px;border-radius:50%;border:3px solid rgba(16,50,61,.15)}
.ex{background:var(--soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ex h3{font-size:16px}
.timer{font:800 15px var(--display);font-variant-numeric:tabular-nums}
.chant{background:#fff7dc;border-radius:16px;padding:16px 18px;font-size:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.chant i{color:var(--muted);font-size:15px;align-self:center}
.reveal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.reveal button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--soft);border:0;border-radius:14px;padding:10px 14px;font-weight:700}
.reveal .emoji{font-size:34px}
.reveal .ans{color:var(--primary-deep);font-weight:800;visibility:hidden}
.reveal button.open .ans{visibility:visible}

/* breath */
.breath{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lung{width:92px;height:92px;border-radius:50%;background:var(--primary);opacity:.9;transform:scale(.55);flex:none}
.lung.go{animation:lung 10s ease-in-out 3}
@keyframes lung{0%{transform:scale(.55)}40%{transform:scale(1)}100%{transform:scale(.55)}}

/* games */
.game{background:var(--surface);border:2px solid var(--primary);border-radius:var(--r);padding:20px clamp(14px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.game-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.game-head h3{font-size:19px;margin-top:6px}
.stars{font:800 18px var(--display);color:var(--primary-deep);background:var(--sun);border-radius:999px;padding:6px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.prompt{font:600 clamp(20px,3vw,28px)/1.25 var(--display);text-align:center;min-height:1.3em;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.prompt .emoji{font-size:84px}
.shadow{filter:brightness(0);opacity:.78}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{background:var(--soft);border:3px solid transparent;border-radius:16px;padding:14px 8px;min-height:92px;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;font-weight:800;font-size:18px;text-align:center}
.opt .emoji{font-size:56px}
.opt:hover{border-color:var(--primary)}
.opt.right{background:#d9f5e4;border-color:var(--good)}
.opt.wrong{background:#fde3de;border-color:var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{min-height:1.6em;text-align:center;font-weight:800;font-size:18px}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto;width:100%}
.mem button{aspect-ratio:1;border:0;border-radius:14px;background:var(--primary);font-size:clamp(30px,6vw,46px);display:grid;place-items:center;color:#fff;font-family:var(--display)}
.mem button.up{background:var(--soft)}
.mem button.done{background:#d9f5e4}
.pile{display:flex;gap:26px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.heap{background:var(--soft);border:3px solid transparent;border-radius:18px;padding:14px;width:min(100%,300px);min-height:150px;display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;font-size:36px}
.heap:hover{border-color:var(--primary)}
.heap.right{background:#d9f5e4;border-color:var(--good)} .heap.wrong{background:#fde3de;border-color:var(--bad)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.tabs.big button{font:800 22px var(--display);width:60px;height:60px;padding:0;border-radius:18px}
.stones{display:flex;flex-wrap:wrap;gap:10px}
.stones button{font:800 24px var(--display);min-width:76px;padding:14px 10px;border-radius:40px 46px 38px 44px;border:0;background:#cfd9d6;color:var(--ink)}
.stones button.lit{background:var(--sun)}
.sent{font-size:20px;font-weight:700}
.sent mark{background:none;color:var(--coral);font-weight:800}
.story{background:#fff7dc;border-radius:16px;padding:16px 18px;font-size:19px;max-width:none}

/* syllable table */
.tbl{overflow-x:auto}
table.syl{border-collapse:separate;border-spacing:5px;font:800 19px var(--display)}
table.syl th{color:var(--muted);font-size:14px;padding:4px}
table.syl td button{width:58px;height:46px;border:0;border-radius:12px;background:var(--soft)}
table.syl td button:hover,table.syl td button.on{background:var(--sun)}
.bigsyl{font:800 clamp(60px,12vw,110px)/1 var(--display);color:var(--primary-deep);text-align:center;min-height:1.1em}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tiles button{font:800 26px var(--display);padding:12px 20px;border-radius:14px;border:0;background:var(--sun);color:var(--primary-deep)}
.tiles button:disabled{opacity:.25;cursor:default}
.built{font:800 34px var(--display);letter-spacing:.04em;text-align:center;min-height:1.3em;color:var(--primary-deep)}

/* pyramid */
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr button{border:0;color:#fff;font:600 15px/1.25 var(--display);padding:16px 12px;border-radius:12px;text-align:center}
.pyr button.on{outline:4px solid var(--sun);outline-offset:2px}
.pyr .base{background:#56727c}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15.5px}
.chip.arrow::after{content:"→";margin-left:10px;color:var(--coral);font-weight:800}
.chip.arrow:last-child::after{content:none}

/* neuro */
.lvl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lvl b{font:800 18px var(--display);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ncard{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ncard h3{display:flex;gap:10px;align-items:center}
.ncard h3 span{font:800 14px var(--display);background:var(--coral);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex:none}
.kit{display:flex;flex-wrap:wrap;gap:16px;align-items:end}
.kit div{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.i-hoop{width:54px;height:26px;border:5px solid var(--coral);border-radius:50%}
.i-cube{width:34px;height:34px;background:#2f7de1;border-radius:6px}
.i-cone{width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-bottom:40px solid var(--coral)}
.i-mat{width:54px;height:16px;background:var(--good);border-radius:4px}
.i-brick{width:46px;height:24px;background:var(--sun);border-radius:4px}
.seq{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:64px}
.seq span{padding:8px 12px;border-radius:16px;border:3px solid transparent}
.seq span.now{background:var(--sun);border-color:var(--primary-deep)}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager a{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-decoration:none;font-weight:800;color:var(--primary-deep)}
footer{color:var(--muted);font-size:14px;text-align:center}
.about{display:grid;grid-template-columns:240px 1fr;gap:24px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;align-items:center}
dt{font-weight:800;color:var(--muted)} dd{margin:0}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:292px;z-index:20;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(16,50,61,.45)}
  .menu-btn{display:inline-flex;align-self:flex-start;position:sticky;top:10px;z-index:10}
  .hero,.about{grid-template-columns:1fr}
  .opts{grid-template-columns:repeat(2,1fr)}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  .opt .emoji{font-size:46px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Skin: sticker book. Ink outlines, hard offset shadows, chunky pressable buttons, one accent colour per section group. ===== */
:root{
  --bg:#eef2ff; --surface:#fff; --soft:#ecebff; --line:#1d2452;
  --ink:#1d2452; --muted:#4d557c;
  --primary:#5b3fe0; --primary-deep:#1d2452;
  --sun:#ffc928; --coral:#f0553f; --good:#13894f; --bad:#d8452f;
  --accent:#5b3fe0; --accent-soft:#ecebff;
  --r:22px;
}
.g0{--accent:#0b8a80;--accent-soft:#dcf4f0}
.g1{--accent:#e2452f;--accent-soft:#ffe6e0}
.g2{--accent:#13894f;--accent-soft:#dcf5e7}
.g3{--accent:#5b3fe0;--accent-soft:#ecebff}
.g4{--accent:#1c72d0;--accent-soft:#dfeeff}
.g5{--accent:#c96500;--accent-soft:#ffecd2}
body{background-color:var(--bg);background-image:radial-gradient(rgba(29,36,82,.14) 1.5px,transparent 1.7px);background-size:22px 22px}
a{color:var(--accent)}

/* pressable things */
.btn,.opt,.heap,.tabs button,.stones button,.tiles button,.mem button,table.syl td button,.reveal button,button.card,.pyr button,.pager a,.dir a{
  border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s,background-color .15s}
.btn:hover,.opt:hover,.heap:hover,.tabs button:hover,.stones button:hover,.tiles button:hover:not(:disabled),.mem button:hover,table.syl td button:hover,.reveal button:hover,button.card:hover,.pyr button:hover,.pager a:hover,.dir a:hover{
  transform:translateY(-2px);box-shadow:0 7px 0 var(--ink);border-color:var(--ink)}
.btn:active,.opt:active,.heap:active,.tabs button:active,.stones button:active,.tiles button:active,.mem button:active,table.syl td button:active,.reveal button:active,button.card:active,.pyr button:active,.pager a:active,.dir a:active{
  transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn{background:var(--accent);border-radius:16px;padding:11px 22px;font-size:18px;letter-spacing:.01em;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--accent)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sun,.btn.sun:hover{background:var(--sun);color:var(--ink)}
select.btn{appearance:auto;padding:9px 12px}
.btn.menu-btn{display:none}

/* surfaces */
.sheet{border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink);border-radius:var(--r)}
.game{border:2.5px solid var(--ink);box-shadow:7px 7px 0 var(--accent);border-radius:var(--r);background:linear-gradient(var(--accent),var(--accent)) top/100% 12px no-repeat,#fff;padding-top:30px}
.step-n{background:var(--accent);color:#fff;border:2px solid var(--ink);transform:rotate(-3deg);font-size:14px;padding:6px 13px}
.tag{background:var(--sun);color:var(--ink);border:2px solid var(--ink);transform:rotate(-3deg);font-size:13px;padding:4px 12px}
.stars{border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink);transform:rotate(3deg);background:var(--sun);color:var(--ink)}
.stars.pop{animation:pop .45s}
@keyframes pop{40%{transform:rotate(-6deg) scale(1.35)}100%{transform:rotate(3deg) scale(1)}}
.ex{background:var(--accent-soft);border:2px dashed rgba(29,36,82,.35);border-radius:18px}
.chant,.story{background:#fff3c4;border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--sun)}
.chip{background:#fff;border:2px solid var(--ink);padding:5px 14px}
.chip.arrow::after{color:var(--accent)}
.card{background:var(--accent-soft);border-radius:18px}
div.card{border:2.5px solid var(--ink)}
.cards .card:nth-child(4n+2){background:#fff3c4}
.cards .card:nth-child(4n+3){background:#dff5ea}
.cards .card:nth-child(4n+4){background:#ffe6e0}
.opt{background:#fff;border-radius:18px}
.opt:hover{border-color:var(--ink);background:var(--accent-soft)}
.opt.right,.heap.right{background:#c9f2da;border-color:var(--ink)}
.opt.wrong,.heap.wrong{background:#ffd9d2;border-color:var(--ink)}
.heap{background:#fff}
.reveal button{background:#fff}
.reveal button.open{background:#fff3c4}
.mem button{background:var(--accent);border-radius:16px}
.mem button.up{background:#fff}.mem button.done{background:#c9f2da}
.tabs button{border-radius:14px}
.tabs button.on{background:var(--accent);border-color:var(--ink)}
.stones button{background:#fff}
.stones button.lit{background:var(--sun)}
table.syl td button{background:#fff;box-shadow:0 3px 0 var(--ink)}
table.syl td button:hover,table.syl td button.on{background:var(--sun)}
.tiles button{background:var(--sun)}
.lung{background:var(--accent);border:2.5px solid var(--ink)}
.prompt{color:var(--ink)}
.bigsyl,.built{color:var(--accent)}
.swatch{border:2.5px solid var(--ink)}
.ncard{border:2.5px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--accent-soft)}
.ncard h3 span{border:2px solid var(--ink);background:var(--sun);color:var(--ink)}
.lvl b{border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.seq span.now{border-color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.pyr button{border-radius:14px}
.pyr button.on{outline:0;transform:translateY(-3px);box-shadow:0 8px 0 var(--sun)}

/* page banner */
.page-head{background:var(--accent);color:#fff;border:2.5px solid var(--ink);border-radius:28px;box-shadow:7px 7px 0 var(--ink);padding:clamp(18px,3vw,30px);position:relative;padding-right:clamp(18px,3vw,30px);overflow:hidden}
.page-head.has-sticker{padding-right:150px}
.page-head::after{content:"";position:absolute;inset:auto -40px -70px auto;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.14)}
.page-head .kicker{color:var(--ink);background:var(--sun);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;align-self:flex-start;transform:rotate(-2deg)}
.page-head h1{color:#fff}
.page-head .lead{color:#fff;opacity:.95}

GROUPS.forEach(([g,ids])=>{nav.append(el('div',{class:'nav-group'},g));ids.forEach(id=>nav.append(el('a',{href:'#'+id,'data-id':id},el('span',{class:'n'},String(ORDER.indexOf(id)+1)),el('span',null,PAGES[id].short||PAGES[id].title))));});
function route(){let id=location.hash.slice(1);if(!PAGES[id])id='home';const P=PAGES[id],i=ORDER.indexOf(id);stepNo=0;view.innerHTML='';document.body.className='g'+GROUPS.findIndex(g=>g[1].includes(id));
  nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.id===id));side.classList.remove('open');
  if(id!=='home')view.append(el('header',{class:'page-head has-sticker'},el('span',{class:'sticker emoji','aria-hidden':'true'},P.icon),el('div',{class:'kicker'},GROUPS.find(g=>g[1].includes(id))[0]+' · '+(i+1)+' / '+ORDER.length),el('h1',null,P.title),P.lead&&el('p',{class:'lead'},P.lead),printBar(id)));
  view.append(el('div',{class:'pr-only pr-head'},el('span',null,'Аты-жөні: ______________________'),el('span',null,'Күні: ____________'),el('span',null,'«Сөйле, балақай»')));
  view.append(...R[id]().filter(Boolean));
  view.append(el('nav',{class:'pager','aria-label':'Беттер арасында өту'},i>0?el('a',{href:'#'+ORDER[i-1]},'← '+(PAGES[ORDER[i-1]].short||PAGES[ORDER[i-1]].title)):el('span'),i<ORDER.length-1?el('a',{href:'#'+ORDER[i+1]},(PAGES[ORDER[i+1]].short||PAGES[ORDER[i+1]].title)+' →'):el('span')));
  document.querySelector('main').scrollIntoView();window.scrollTo(0,0);}
document.getElementById('menuBtn').addEventListener('click',()=>side.classList.toggle('open'));
document.querySelector('main').addEventListener('click',e=>{if(!e.target.closest('#menuBtn'))side.classList.remove('open');});
document.getElementById('yr').textContent=new Date().getFullYear();
if(TPL)document.querySelector('footer').textContent='© '+new Date().getFullYear()+' «Сөйле, балақай» логопедиялық тапсырмалар жинағы. Материалдарды сабақта және үйде еркін қолдануға болады.';
addEventListener('hashchange',route);route();
</script></body></html>
